# KW-7 AI — демо-версия на 30 дней.
# Инструкция: https://github.com/kw-7lab/ai.kw-7/blob/main/demo/README.md
#
# Перед запуском: Windows — запустите Docker Desktop и дождитесь «Engine running».
#
# Запуск:     docker compose up -d
# Открыть:    http://localhost:8080
# Другой порт: KW7_PORT=8090 docker compose up -d          (Linux)
#              $env:KW7_PORT=8090; docker compose up -d    (PowerShell)
#
# Обновить:   docker compose pull && docker compose up -d   (данные сохраняются)
# Удалить всё вместе с данными: docker compose down -v
#
# Ваши данные (база, файлы, активация) хранятся в томе kw7_data на этом компьютере.

services:
  kw7:
    image: ${KW7_IMAGE:-ghcr.io/kw-7lab/kw7-demo:2026.10.19}
    restart: unless-stopped
    ports:
      - "${KW7_PORT:-8080}:8080"
    environment:
      KW_ADMIN_USER: admin
      KW_ADMIN_PASSWORD: ${KW_ADMIN_PASSWORD:-}
      KW_ACTIVATION_URL: ${KW7_ACTIVATION_URL:-https://kw-7.ru/api/demo-activation/}
    volumes:
      - kw7_data:/data
    # Модель на этой же машине (Ollama, LM Studio) доступна как host.docker.internal —
    # в Docker Desktop это имя есть всегда, на Linux его добавляет эта строка.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - code-exec-net

  # Исполнитель кода (расчёты, которые пишет модель).
  code-executor:
    image: ${KW7_EXECUTOR_IMAGE:-ghcr.io/kw-7lab/kw7-demo-executor:2026.10.19}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    networks:
      - code-exec-net

networks:
  code-exec-net:
    internal: true

volumes:
  kw7_data:
